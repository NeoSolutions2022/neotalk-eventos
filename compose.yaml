services:
  neotalk-eventos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AVATAR_WIDGET_URL: "${NEXT_PUBLIC_AVATAR_WIDGET_URL:-http://localhost:8080/widget}"
    container_name: neotalk-eventos
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
